<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catequesis - Cantos del Camino Neocatecumenal</title>
        <link rel="stylesheet" href="/src/css/catequesis.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
        <script src="src/js/loader.js"></script>


    <div class="app-container">
        <aside class="sidebar">
            <h2>CANTOS</h2>
            <div class="search-box">
                <input type="text" id="buscador" placeholder="Buscar canto...">
            </div>
            <ul id="lista-cantos">
                </ul>
        </aside>

        <main class="content">
            
            
            <article id="detalle-canto">
                <h1 id="titulo-display">Selecciona un canto para ver su catequesis</h1>
                
                <div class="image-container">
                    <img id="imagen-canto" src="" alt="Ilustración" style="display:none;">
                </div>

                <section id="info-canto">
                    <div id="catequesis-cuerpo">
                        </div>
                    
                    <hr class="separator">
                    
                    <div class="lyrics-container">
                        <h3>Letra y Acordes</h3>
                        <pre id="letra-cuerpo"></pre>
                    </div>
                </section>
            </article>
        </main>
    </div>

        <script src="js/catequesis.js"></script>
    <script type="module" src="src/js/moduleGoogle.js"></script>
    <script type="module" src="src/js/logout.js"></script>
    <script src="/src/js/config.js"></script>
    <script src="/src/js/navigator.js"></script>
</body>
</html>

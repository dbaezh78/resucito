<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catequesis - Cantos del Camino Neocatecumenal</title>
        <link rel="stylesheet" href="/src/css/catequesis.css">
        <link rel="icon"        href="/src/img/ico.ico" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
        <script src="js/loader.js"></script>


    <div class="app-container">
        <aside class="sidebar">
            <h2>CANTOS</h2>
            <div class="search-box">
                <input type="text" id="buscador" placeholder="Buscar canto...">
            </div>
            <ul id="lista-cantos">
                </ul>
        </aside>

        <main class="content">
            
            
            <article id="detalle-canto">
                <h1 id="titulo-display">Selecciona un canto para ver su catequesis</h1>
                
                <div class="image-container">
                    <img id="imagen-canto" src="" alt="Ilustración" style="display:none;">
                </div>

                <section id="info-canto">
                    <div id="catequesis-cuerpo">
                        </div>
                    
                    <hr class="separator">
                    
                    <div class="lyrics-container">
                        <h3>Letra y Acordes</h3>
                        <pre id="letra-cuerpo"></pre>
                    </div>
                </section>
            </article>
        </main>
    </div>

    <script src="js/LogControl.js"></script>
    <!-- Cargador Dinámico de Base de Datos de Cantos por Idioma -->
    <script>
        (function() {
            const lang = localStorage.getItem('pref-lang') || 'Español';
            const suffixes = {
                'English': '_en',
                'Italiano': '_it',
                'Português': '_pt',
                'Français': '_fr',
                'Latin': '_la',
                'Ruso': '_ru',
                'Chino': '_zh'
            };
            const suffix = suffixes[lang] || '';
            const s = document.createElement('script');
            s.async = false;
            if (suffix) {
                s.src = `js/songs-data${suffix}.js`;
                s.onerror = function() {
                    console.warn(`js/songs-data${suffix}.js no encontrado. Usando versión por defecto en español.`);
                    const fallback = document.createElement('script');
                    fallback.src = 'js/songs-data.js';
                    fallback.async = false;
                    document.head.appendChild(fallback);
                };
            } else {
                s.src = 'js/songs-data.js';
            }
            document.head.appendChild(s);
        })();
    </script>

    <script src="js/catequesis.js"></script>
    <script type="module" src="js/moduleGoogle.js"></script>
    <script type="module" src="js/logout.js"></script>
    <script src="/src/js/config.js"></script>
    <script src="/src/js/navigator.js"></script>
</body>
</html>
